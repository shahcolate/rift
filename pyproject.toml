[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rift-eval"
version = "1.0.0"
description = "Detect behavioral regressions between LLM model versions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shah Baig" },
]
keywords = ["llm", "evaluation", "drift", "regression", "testing"]
urls = { Homepage = "https://github.com/shahcolate/rift", Repository = "https://github.com/shahcolate/rift", Issues = "https://github.com/shahcolate/rift/issues" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The self-hosted control plane (`rift serve`): dashboard + monitoring API +
# scheduler. Kept optional so the core CLI install stays lean.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "pyright>=1.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
rift = "rift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rift"]

# The package reads built-in suites and the demo's recorded outcomes from
# disk at runtime. The canonical copies live at the repo root (see CLAUDE.md
# layout); force-include bakes them into the wheel under rift/_data/ so a
# `pip install rift-eval` ships them. Running from a source checkout or an
# editable install falls back to the repo-root copies (see config.py / demo.py).
[tool.hatch.build.targets.wheel.force-include]
"suites" = "rift/_data/suites"
"benchmarks/context_rot_outcomes.yaml" = "rift/_data/benchmarks/context_rot_outcomes.yaml"
# NOTE: the dashboard's Jinja templates and static assets live *inside* the
# package (src/rift/server/), so hatchling ships them as package data
# automatically — no force-include needed (that would duplicate the entries).

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
