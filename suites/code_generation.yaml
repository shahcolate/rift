name: code_generation
description: Generate correct Python functions from specifications
scoring: exec_tests
model_params:
  temperature: 0
cases:
  - input: |
      Write a Python function called `fizzbuzz` that takes an integer n and returns a list of strings from 1 to n where multiples of 3 are "Fizz", multiples of 5 are "Buzz", multiples of both are "FizzBuzz", and all others are the number as a string.

      Return ONLY the function, no explanation or markdown.
    expected:
      function: fizzbuzz
      tests:
        - args: [1]
          expected: ["1"]
        - args: [5]
          expected: ["1", "2", "Fizz", "4", "Buzz"]
        - args: [15]
          expected: ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]
        - args: [30]
          expected: ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz", "16", "17", "Fizz", "19", "Buzz", "Fizz", "22", "23", "Fizz", "Buzz", "26", "Fizz", "28", "29", "FizzBuzz"]
    tags: ["basic", "loops"]

  - input: |
      Write a Python function called `is_palindrome` that takes a string and returns True if it reads the same forwards and backwards (case-insensitive, ignoring non-alphanumeric characters).

      Return ONLY the function, no explanation or markdown.
    expected:
      function: is_palindrome
      tests:
        - args: ["racecar"]
          expected: true
        - args: ["A man, a plan, a canal: Panama"]
          expected: true
        - args: ["hello"]
          expected: false
        - args: [""]
          expected: true
        - args: ["No 'x' in Nixon"]
          expected: true
        - args: ["not a palindrome"]
          expected: false
    tags: ["basic", "strings"]

  - input: |
      Write a Python function called `flatten` that takes an arbitrarily nested list and returns a flat list of all elements.
      Example: flatten([1, [2, [3, 4], 5], 6]) should return [1, 2, 3, 4, 5, 6].

      Return ONLY the function, no explanation or markdown.
    expected:
      function: flatten
      tests:
        - args: [[1, [2, [3, 4], 5], 6]]
          expected: [1, 2, 3, 4, 5, 6]
        - args: [[]]
          expected: []
        - args: [[1, 2, 3]]
          expected: [1, 2, 3]
        - args: [[[[[1]]], 2, [3, [4, [5]]]]]
          expected: [1, 2, 3, 4, 5]
        - args: [[[], [[]], [1, [], 2]]]
          expected: [1, 2]
    tags: ["recursion"]

  - input: |
      Write a Python function called `two_sum` that takes a list of integers `nums` and a target integer, and returns the indices [i, j] (with i < j) of the two numbers that add up to the target. Assume exactly one solution exists.

      Return ONLY the function, no explanation or markdown.
    expected:
      function: two_sum
      tests:
        - args: [[2, 7, 11, 15], 9]
          expected: [0, 1]
        - args: [[3, 2, 4], 6]
          expected: [1, 2]
        - args: [[3, 3], 6]
          expected: [0, 1]
        - args: [[-1, -2, -3, -4, -5], -8]
          expected: [2, 4]
    tags: ["algorithms", "hash_map"]

  - input: |
      Write a Python function called `merge_sorted` that takes two sorted lists of integers and returns a single sorted list containing all elements.

      Return ONLY the function, no explanation or markdown.
    expected:
      function: merge_sorted
      tests:
        - args: [[1, 3, 5], [2, 4, 6]]
          expected: [1, 2, 3, 4, 5, 6]
        - args: [[], []]
          expected: []
        - args: [[1, 2, 3], []]
          expected: [1, 2, 3]
        - args: [[], [4, 5, 6]]
          expected: [4, 5, 6]
        - args: [[1, 1, 2], [1, 2, 3]]
          expected: [1, 1, 1, 2, 2, 3]
        - args: [[-5, -1, 0], [-3, 2, 7]]
          expected: [-5, -3, -1, 0, 2, 7]
    tags: ["algorithms", "sorting"]
