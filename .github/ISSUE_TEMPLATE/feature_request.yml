name: Feature request
description: Suggest a new capability or improvement for Rift
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the
        [README roadmap](https://github.com/shahcolate/rift#readme) and
        [existing issues](https://github.com/shahcolate/rift/issues) first —
        it may already be planned or under discussion.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: "I want to gate cross-vendor procurement on cost-per-correct, but..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Rift to do? A CLI sketch or config example helps.
      placeholder: |
        rift compare ... --new-flag
        or a new scoring: / suite field
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Rift does this touch?
      options:
        - CLI / UX
        - Statistics / drift metrics
        - Providers (Anthropic / OpenAI / Google / new)
        - Scoring (exact / semantic / llm_judge / exec_tests / custom)
        - Suites / eval data
        - Reporting / output formats
        - Faithfulness / sycophancy / specialized probes
        - CI/CD integration
        - Observability / metrics export
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
          required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and the roadmap, and this isn't a duplicate.
          required: true
