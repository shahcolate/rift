# Config for release-drafter (.github/workflows/release-drafter.yml).
# Keeps a running *draft* GitHub Release up to date as PRs merge to main, so
# cutting a release is one click: open the draft, sanity-check, Publish — which
# fires the `release: published` event that publish.yml listens for → PyPI.
#
# PR labels drive both categorization and the auto-computed version bump. No
# labels needed to start: unlabeled PRs still appear under "Other changes" and
# the version defaults to a patch bump.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug fixes'
    labels: ['fix', 'bug']
  - title: '📊 Stats & methodology'
    labels: ['stats', 'methodology']
  - title: '🧪 Tests & CI'
    labels: ['test', 'tests', 'ci']
  - title: '📝 Docs'
    labels: ['docs', 'documentation']
  - title: '🧰 Maintenance'
    labels: ['chore', 'refactor', 'deps', 'dependencies']

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'  # avoid markdown/mention injection from PR titles

# Semantic-version bump inferred from the labels on the merged PRs since the
# last release. Falls back to a patch bump when nothing matches.
version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature', 'enhancement']
  patch:
    labels: ['patch', 'fix', 'bug', 'chore', 'docs', 'ci', 'test']
  default: patch

exclude-labels:
  - 'skip-changelog'

# Apply the category/version labels above automatically from each PR's title,
# branch, and touched files, so categorized notes and semver bumps need no
# manual labeling. Within one entry the matchers are OR'd; a PR can match
# several entries and get several labels. release-drafter creates any of these
# labels that don't yet exist. (Fork PRs get a read-only token and so aren't
# autolabeled — categorize those by hand if needed.)
autolabeler:
  - label: 'docs'
    files: ['**/*.md']
  - label: 'ci'
    files: ['.github/**']
  - label: 'test'
    files: ['tests/**']
  - label: 'stats'
    files: ['src/rift/comparator.py', 'src/rift/discovery.py']
  - label: 'feature'
    title: ['/^(feat|add)\b/i']
    branch: ['/^(feat|feature)\//']
  - label: 'fix'
    title: ['/^(fix|bug)\b/i']
    branch: ['/^(fix|bugfix)\//']
  - label: 'chore'
    title: ['/^(chore|refactor|bump|deps|build)\b/i']

template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/shahcolate/rift/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ---
  Install/upgrade: `pip install -U rift-eval`
