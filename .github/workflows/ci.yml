name: CI

# Lint, type-check, and test on every push and pull request so the
# "you upgraded your model — what broke?" tooling can't itself regress
# silently. The README's test/lint claims are gated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (pyright)
        run: pyright src/

      - name: Test (pytest)
        run: pytest tests/ -q

      - name: Smoke-test the keyless demo
        run: rift demo
