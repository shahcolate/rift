# Frontier head-to-head benchmark — on-demand live capture.
#
# Runs benchmarks/frontier/run_frontier.py in live mode on a GitHub
# runner, which can reach both vendors' APIs with the repo secrets
# (useful when a local/sandboxed network can't). The report and the raw
# run JSONs are uploaded as an artifact and, by default, committed back
# to the branch the workflow was dispatched on so the capture is
# replayable (`--mode replay`) and auditable.
#
# Setup (maintainer): add repo secrets ANTHROPIC_API_KEY and
# OPENAI_API_KEY (plus GEMINI_API_KEY if you dispatch Gemini pairs).
#
# Cost: the driver's --max-cost (default $25) is a pre-flight refusal
# plus a stage-level cap on metered CONTESTANT spend; judged runs
# additionally bill the judge's provider (untracked by the runner —
# the pre-flight estimate carries a judge margin, the cap does not).
# The default pair/panel typically lands well under the cap.

name: Frontier benchmark

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline model (alias or id)"
        required: false
        default: "fable-5"
      challenger:
        description: "Challenger model (alias or id)"
        required: false
        default: "gpt-5.6-sol"
      trials:
        description: "Replication trials per case (noise floor)"
        required: false
        default: "1"
      max_cost:
        description: "USD cost cap (pre-flight refusal)"
        required: false
        default: "25"
      judged:
        description: "Include the LLM-judged open_ended_qa suite (exploratory; cross-vendor judge caveat)"
        type: boolean
        required: false
        default: false
      commit_results:
        description: "Commit run JSONs + report to this branch"
        type: boolean
        required: false
        default: true

concurrency:
  group: frontier-benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rift
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # Secrets and inputs reach the shell via env:, never interpolated
      # as ${{ }} into a run: body (script-injection hygiene; same
      # pattern as observatory.yml).
      - name: Run frontier benchmark (live)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASELINE: ${{ inputs.baseline }}
          CHALLENGER: ${{ inputs.challenger }}
          TRIALS: ${{ inputs.trials }}
          MAX_COST: ${{ inputs.max_cost }}
          JUDGED: ${{ inputs.judged }}
        run: |
          set -o pipefail
          args=(benchmarks/frontier/run_frontier.py --mode live
                --baseline "$BASELINE" --challenger "$CHALLENGER"
                --trials "$TRIALS" --max-cost "$MAX_COST")
          if [ "$JUDGED" = "true" ]; then
            args+=(--judged)
          fi
          python "${args[@]}" | tee frontier.log
          report=$(sed -n 's/^report:  //p' frontier.log | tail -1)
          if [ -n "$report" ] && [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-results
          path: benchmarks/frontier/results/
          if-no-files-found: ignore

      - name: Commit results
        if: inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frontier/results/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "frontier benchmark: $(date -u +%F) capture"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
