# Rift Observatory — scheduled behavioral monitoring of live endpoints.
#
# Weekly: run the panel (observatory/panel.yaml) against the live endpoints,
# append the observations to the orphan `observatory-data` branch, and deploy
# the rendered static dashboard to GitHub Pages.
# Monthly (or dispatch with selftest=true): refresh each endpoint's null
# calibration (`rift selftest`) so the dashboard can cite the gate's
# empirical false-regression rate.
#
# One-time setup (maintainer):
#   1. Create the data branch:  git switch --orphan observatory-data
#      && git commit --allow-empty -m "observatory: init" && git push -u origin observatory-data
#   2. Add repo secrets: ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY.
#   3. Settings → Pages → Source: GitHub Actions.
#
# Failure semantics: `rift observe` handles endpoint outages and budget
# aborts internally (exit 0, partial observations recorded). A non-zero exit
# is infrastructure failure — the job fails, nothing is committed, and Pages
# keeps serving the last good build.
#
# DELIBERATELY NO completion-cache persistence (actions/cache) across runs:
# the runner caches completions by (model, params, prompt), and the panel's
# prompts are fixed week to week — a restored cache would turn every
# subsequent "observation" into a replay of week 1 (scores AND fingerprints
# round-trip through the cache), structurally blinding the observatory to
# the very drift it exists to detect. Each pass must hit the live endpoint.

name: Observatory

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly panel — Monday 06:00 UTC
    - cron: "0 7 1 * *"   # monthly selftest refresh — 1st, 07:00 UTC
  workflow_dispatch:
    inputs:
      max_cost:
        description: "Override the panel's USD cost cap"
        required: false
        default: ""
      selftest:
        description: "Run the selftest refresh instead of the panel"
        type: boolean
        required: false
        default: false

concurrency:
  group: observatory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  observe:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') ||
      (github.event_name == 'workflow_dispatch' && !inputs.selftest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Checkout observatory-data branch
        uses: actions/checkout@v7
        with:
          ref: observatory-data
          path: observatory-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rift
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # Secrets and inputs reach the shell via env:, never interpolated as
      # ${{ }} into a run: body (script-injection hygiene; same pattern as
      # .github/actions/rift-drift-check).
      - name: Run observatory panel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_COST: ${{ inputs.max_cost }}
        run: |
          # Without pipefail, `| tee` would mask a crashed observe pass and
          # let the commit step push partial data to the permanent record.
          set -o pipefail
          args=(observe --panel observatory/panel.yaml --data-dir observatory-data)
          if [ -n "$MAX_COST" ]; then
            args+=(--max-cost "$MAX_COST")
          fi
          rift "${args[@]}" | tee observe.log
          {
            echo '## Observatory pass'
            echo '```'
            cat observe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit observations
        run: >-
          bash .github/scripts/observatory_commit.sh
          "observatory: $(date -u +%F) observations"

  selftest:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 7 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.selftest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Checkout observatory-data branch
        uses: actions/checkout@v7
        with:
          ref: observatory-data
          path: observatory-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rift
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run selftest refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash .github/scripts/observatory_selftest.sh

      - name: Commit selftest results
        run: >-
          bash .github/scripts/observatory_commit.sh
          "observatory: $(date -u +%F) selftest refresh"

  # Deploys after EITHER job so a monthly selftest refresh also updates the
  # published calibration figures, not just the weekly panel.
  pages:
    needs: [observe, selftest]
    if: >-
      !cancelled() &&
      (needs.observe.result == 'success' || needs.selftest.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions REPLACE the workflow-level block, so re-grant
      # contents: read — checkout would otherwise rely on anonymous clone,
      # which breaks the moment the repo goes private.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Checkout observatory-data branch
        uses: actions/checkout@v7
        with:
          ref: observatory-data
          path: observatory-data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rift
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Render site
        run: rift observatory-site --data-dir observatory-data --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
