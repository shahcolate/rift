name: Publish to PyPI

# Builds the wheel + sdist and publishes to PyPI when a GitHub Release is
# published (tag like v0.1.0). Uses PyPI Trusted Publishing (OIDC): no API
# token is stored in the repo. One-time setup: on PyPI, add a trusted
# publisher for project "rift-eval" pointing at this repo + workflow.
# https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual runs for dry-running the build

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on an actual release, not manual dry-run builds.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/rift-eval
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
