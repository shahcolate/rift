# Pre-registration for the frontier head-to-head benchmark
# (benchmarks/frontier/run_frontier.py).
#
# Committed BEFORE the first live capture. The driver binds the headline
# verdict to the ONE primary endpoint declared here; every other number in
# the report (per-suite drift, cost, tokens, judged suites) is exploratory.
#
# The primary endpoint is pooled ALL-OR-NOTHING accuracy on the frontier
# panel: the concatenation of the three judge-free suites (reasoning +
# extraction + hard_reasoning = 63 paired cases), matched per case,
# pairs errored on either side excluded (an outage is not drift), and
# every case binarized at full credit (score >= 0.999 counts 1, anything
# less counts 0 — extraction's per-field partial credit does NOT count).
# The binarization guarantees the primary a binary vector, and therefore
# McNemar's exact test, at trials=1; with --trials > 1 the case score is
# the fraction of fully-correct trials and the test is paired-t. Pooling
# and binarization are declared here, in advance — they are not post-hoc
# aggregation choices.

primary: accuracy

# Cross-vendor question ("did either model come out ahead?"), not an
# upgrade gate — so two-sided, unlike the regression-only default.
direction: two_sided

alpha: 0.05

# 63 pairs when nothing errors; require at least 60 so an
# outage-degraded capture dishonors the plan instead of quietly
# confirming on a fragment.
min_cases: 60

# The panel is powered (~80%) for a marginal-accuracy gap of roughly 15
# percentage points at n=63; smaller true gaps will often read as "no
# significant difference". Reported for the record, not enforced.
target_effect: 0.15

suite: frontier_panel_v1
baseline: claude-fable-5
challenger: gpt-5.6-sol

hypothesis: >-
  On judge-free capability suites, GPT-5.6 Sol and Claude Fable 5 do not
  differ significantly in pooled accuracy; any separation between the
  two frontier tiers will show up in cost per correct answer and token
  profile, not raw capability.
